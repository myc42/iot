apiVersion: v1
kind: Service
metadata:
  # 1. IDENTITÉ DU SERVICE
  name: app1-service # Exemple : service-app-1
spec:
  # 2. LE RADAR (Le lien magique avec le Déploiement)
  selector:
    app: app1 # TRÈS IMPORTANT : Doit être exactement le même mot que tu as mis dans le "matchLabels" de ton Déploiement !
  
  # 3. LA GESTION DES PORTES
  ports:
    - port: 80 # La porte d'entrée de ce Service (en général, on met 80 pour le web)
      targetPort: 80 # Le port de ton app (celui que tu avais mis dans containerPort, donc 80)

---


